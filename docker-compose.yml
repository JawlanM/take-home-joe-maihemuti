# One command local run:  docker compose up --build
# Then load the seed data:  docker compose exec backend python -m seed.load_seed
services:
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    environment:
      MONGODB_URI: mongodb://mongo:27017
      CORS_ORIGINS: http://localhost:5173
      # Optional: put GEMINI_API_KEY=... in a .env file next to this file.
      # Without it the app works and AI summaries show as "disabled".
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
