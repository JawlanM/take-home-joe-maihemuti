[project]
name = "candidate-tracker-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "PL"]
ignore = [
    "PLR0913",  # FastAPI/pydantic signatures; argument count is checked in review instead
]

[tool.ruff.lint.per-file-ignores]
# A literal 404 reads better than a named constant in an assertion.
"tests/*" = ["PLR2004"]

[tool.mypy]
ignore_missing_imports = true
